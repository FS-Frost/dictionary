		// arranca offline si el caché HTTP del navegador conserva el JS, que no es

		function warmCache() {

							// Los shards son decenas de MB y tienen su propio caché;
							// el manifiesto sí hace falta, porque sin él la búsqueda
							// offline ni siquiera sabe qué idiomas hay.
							if (url.indexOf("/data/") === -1) return true;

							return url.indexOf("manifest.json") !== -1;
						});

					urls.push(location.pathname);

						urls: urls,
